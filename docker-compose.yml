services:
  grampsweb: &grampsweb
    image: ghcr.io/gramps-project/grampsweb:latest
    restart: always
    ports:
      - "8001:5000"  # host:docker
    environment:
      GRAMPSWEB_TREE: "${GRAMPSWEB_TREE:?Set GRAMPSWEB_TREE in .env}"  # will create a new tree if not exists
      GRAMPSWEB_BASE_URL: "${GRAMPSWEB_BASE_URL:?Set GRAMPSWEB_BASE_URL in .env}"  # the address Gramps Web is reached at, used in links in e-mails
      GRAMPSWEB_CELERY_CONFIG__broker_url: "redis://grampsweb_redis:6379/0"
      GRAMPSWEB_CELERY_CONFIG__result_backend: "redis://grampsweb_redis:6379/0"
      GRAMPSWEB_RATELIMIT_STORAGE_URI: redis://grampsweb_redis:6379/1
      GRAMPSWEB_DISABLE_TELEMETRY: true
      GRAMPSWEB_EMAIL_HOST: "smtp.gmail.com"  #SMTP server host (e.g. for sending password reset e-mails)
      GRAMPSWEB_EMAIL_PORT: 465   #SMTP server port. defaults to 465
      GRAMPSWEB_EMAIL_HOST_USER: "${GRAMPSWEB_EMAIL_HOST_USER:?Set GRAMPSWEB_EMAIL_HOST_USER in .env}"
      GRAMPSWEB_EMAIL_HOST_PASSWORD: "${GRAMPSWEB_EMAIL_HOST_PASSWORD:?Set GRAMPSWEB_EMAIL_HOST_PASSWORD in .env}"
      GRAMPSWEB_EMAIL_USE_SSL: true  #Boolean, whether to use implicit SSL/TLS for SMTP (v3.6.0+). Defaults to True if EMAIL_USE_TLS is not explicitly set. Typically used with port 465.
      GRAMPSWEB_EMAIL_USE_STARTTLS: false  #Boolean, whether to use explicit STARTTLS for SMTP (v3.6.0+). Defaults to False. Typically used with port 587 or 25.
      GRAMPSWEB_DEFAULT_FROM_EMAIL: "${GRAMPSWEB_DEFAULT_FROM_EMAIL:?Set GRAMPSWEB_DEFAULT_FROM_EMAIL in .env}"
      # GUNICORN_NUM_WORKERS: 8 # optional variable, each worker increases efficiency, but takes resources (CPU and RAM)
    depends_on:
      - grampsweb_redis
    volumes:
      - ./data/gramps_users:/app/users  # persist user database
      - ./data/gramps_index:/app/indexdir  # persist search index
      - ./data/gramps_thumb_cache:/app/thumbnail_cache  # persist thumbnails
      - ./data/gramps_cache:/app/cache  # persist export and report caches
      - ./data/gramps_secret:/app/secret  # persist flask secret
      - ./data/gramps_db:/root/.gramps/grampsdb  # persist Gramps database
      - ./data/gramps_media:/app/media  # persist media files
      - ./data/gramps_tmp:/tmp

  grampsweb_celery:
    <<: *grampsweb  # YAML merge key copying the entire grampsweb service config
    ports: []
    container_name: grampsweb_celery
    depends_on:
      - grampsweb
      - grampsweb_redis
    command: celery -A gramps_webapi.celery worker --loglevel=INFO --concurrency=2

  grampsweb_redis:
    image: docker.io/valkey/valkey:8-alpine
    container_name: grampsweb_redis
    restart: always

